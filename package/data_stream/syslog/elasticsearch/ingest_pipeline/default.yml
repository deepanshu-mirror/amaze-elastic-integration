---
description: Pipeline for normalizing AMaze dispatcher Rich Alerts (syslog mode) into ECS.

processors:
  # Decode the JSON Rich Alert carried in the syslog MSG body. The syslog
  # processor already strips the RFC3164 header and APP-NAME; if the
  # APP-NAME prefix was preserved, dissect it out before decoding.
  - json:
      field: message
      add_to_root: true
      ignore_failure: true
  - dissect:
      field: message
      pattern: "%{?amaze_app}: %{amaze_json_body}"
      ignore_failure: true
  - json:
      field: amaze_json_body
      add_to_root: true
      ignore_failure: true
  - remove:
      field: amaze_json_body
      ignore_missing: true

  # Preserve original values in the amaze.* namespace for forensics.
  - set:
      field: amaze.alert_type
      copy_from: alert_type
      ignore_empty_value: true
  - set:
      field: amaze.schema_version
      copy_from: schema_version
      ignore_empty_value: true
  - set:
      field: amaze.ticket_id
      copy_from: ticket_id
      ignore_empty_value: true
  - set:
      field: amaze.neural_event_id
      copy_from: neural_event_id
      ignore_empty_value: true
  - set:
      field: amaze.timestamp
      copy_from: timestamp
      ignore_empty_value: true
  - set:
      field: amaze.src_ip
      copy_from: src_ip
      ignore_empty_value: true
  - set:
      field: amaze.dest_ip
      copy_from: dest_ip
      ignore_empty_value: true
  - set:
      field: amaze.threat_score
      copy_from: threat_score
      ignore_empty_value: true
  - set:
      field: amaze.fraud_score
      copy_from: fraud_score
      ignore_empty_value: true
  - set:
      field: amaze.threat_type
      copy_from: threat_type
      ignore_empty_value: true
  - set:
      field: amaze.country
      copy_from: country
      ignore_empty_value: true
  - set:
      field: amaze.lat
      copy_from: lat
      ignore_empty_value: true
  - set:
      field: amaze.lon
      copy_from: lon
      ignore_empty_value: true
  - set:
      field: amaze.username
      copy_from: username
      ignore_empty_value: true
  - set:
      field: amaze.user_agent
      copy_from: user_agent
      ignore_empty_value: true
  - set:
      field: amaze.ja3_hash
      copy_from: ja3_hash
      ignore_empty_value: true
  - set:
      field: amaze.initial_ttp
      copy_from: initial_ttp
      ignore_empty_value: true
  - set:
      field: amaze.ttp
      copy_from: ttp
      ignore_empty_value: true
  - set:
      field: amaze.site_id
      copy_from: site_id
      ignore_empty_value: true
  - set:
      field: amaze.sca_id
      copy_from: sca_id
      ignore_empty_value: true
  - set:
      field: amaze.sca_name
      copy_from: sca_name
      ignore_empty_value: true
  - set:
      field: amaze.vm_id
      copy_from: vm_id
      ignore_empty_value: true
  - set:
      field: amaze.enrichment_details
      copy_from: enrichment_details
      ignore_empty_value: true
  - set:
      field: amaze.logline
      copy_from: logline
      ignore_empty_value: true

  # ECS mapping.
  - rename:
      field: timestamp
      target_field: "@timestamp"
      ignore_missing: true
  - rename:
      field: src_ip
      target_field: source.ip
      ignore_missing: true
  - rename:
      field: dest_ip
      target_field: destination.ip
      ignore_missing: true
  - rename:
      field: country
      target_field: source.geo.country_iso_code
      ignore_missing: true
  - rename:
      field: protocol
      target_field: network.protocol
      ignore_missing: true
  - rename:
      field: threat_score
      target_field: event.severity
      ignore_missing: true
  - rename:
      field: ttp
      target_field: threat.technique.id
      ignore_missing: true
  - rename:
      field: threat_type
      target_field: event.action
      ignore_missing: true
  - rename:
      field: username
      target_field: user.name
      ignore_missing: true
  - rename:
      field: user_agent
      target_field: user_agent.original
      ignore_missing: true
  - rename:
      field: logline
      target_field: message
      ignore_missing: true
  - rename:
      field: neural_event_id
      target_field: event.id
      ignore_missing: true

  # Geo point derived from the lat/lon reported by AMaze.
  - set:
      field: source.geo.location
      value: "{{lat}},{{lon}}"
      if: ctx?.lat != null && ctx?.lon != null

  # ECS categorization.
  - set:
      field: event.kind
      value: alert
  - set:
      field: event.category
      value: [intrusion_detection]
  - set:
      field: event.type
      value: [info]
  - set:
      field: event.module
      value: amaze
  - set:
      field: event.dataset
      value: amaze.syslog
  - set:
      field: event.created
      value: "{{{_ingest.timestamp}}}"
  - set:
      field: event.ingested
      value: "{{{_ingest.timestamp}}}"

on_failure:
  - set:
      field: error.message
      value: "{{ _ingest.on_failure_message }}"
