format_version: "3.0.0"

name: amaze

title: MirrorMire AMaze

version: "1.0.0"

description: "MirrorMire AMaze Elastic Package for receiving dispatcher-pushed Rich Alerts in Elastic Security"

type: integration

categories:
  - security

conditions:
  kibana:
    version: "^8.0.0"

policy_templates:
  - name: amaze
    title: AMaze Integration
    description: Receive Rich Alerts pushed by the MirrorMire AMaze dispatcher
    data_streams:
      - dispatch
      - syslog
    inputs:
      - type: http_endpoint
        title: AMaze Dispatch (Webhook)
        description: Receive AMaze Rich Alerts pushed over HTTP webhook
      - type: udp
        title: AMaze Syslog (UDP)
        description: Receive AMaze Rich Alerts over UDP syslog
      - type: tcp
        title: AMaze Syslog (TCP)
        description: Receive AMaze Rich Alerts over TCP syslog

icons:
  - src: "/img/amaze-logo.svg"
    title: MirrorMire AMaze logo
    size: 1254x1254
    type: image/svg+xml
  - src: "/img/amaze-logo.png"
    title: MirrorMire AMaze logo
    size: 1254x1254
    type: image/png

owner:
  github: MirrorMire
  type: community